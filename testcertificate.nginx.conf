# Redirect HTTP → HTTPS + serve Let's Encrypt challenges
server {
    listen 80;
    server_name testcertificate.ultralink.cloud testcertificate-api.ultralink.cloud testcertificate-database.ultralink.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend — testcertificate.ultralink.cloud
server {
    listen 443 ssl http2;
    server_name testcertificate.ultralink.cloud;

    ssl_certificate     /etc/letsencrypt/live/testcertificate.ultralink.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testcertificate.ultralink.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Backend API — testcertificate-api.ultralink.cloud
server {
    listen 443 ssl http2;
    server_name testcertificate-api.ultralink.cloud;

    ssl_certificate     /etc/letsencrypt/live/testcertificate.ultralink.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testcertificate.ultralink.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    300;
        proxy_connect_timeout 300;
        proxy_send_timeout    300;
    }
}

# phpMyAdmin — testcertificate-database.ultralink.cloud
server {
    listen 443 ssl http2;
    server_name testcertificate-database.ultralink.cloud;

    ssl_certificate     /etc/letsencrypt/live/testcertificate.ultralink.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testcertificate.ultralink.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    location / {
        proxy_pass         http://localhost:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
